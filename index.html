<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حيدر نصيف</title>
<meta name="description" content="حيدر نصيف: أنظمتي وحساباتي في مكان واحد">
<meta property="og:title" content="حيدر نصيف">
<meta property="og:description" content="أنظمتي وحساباتي في مكان واحد">
<meta name="theme-color" content="#081a17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#081a17; --gold:#d9b45c; --gold-l:#f0d898; --gold-d:#8a6c2e; --cream:#f4ede0; --muted:#8fa8a0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; color:var(--cream);
    background:
      radial-gradient(70% 45% at 50% 0%, rgba(217,180,92,.16), transparent 70%),
      radial-gradient(50% 35% at 50% 100%, rgba(30,90,78,.35), transparent 70%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; padding:48px 16px;
  }
  main{width:100%; max-width:420px; text-align:center; animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .star{width:64px;height:64px;margin:0 auto 22px;display:block;animation:spin 60s linear infinite}
  h1{font-family:"Reem Kufi",serif;font-weight:700;font-size:44px;line-height:1.15;
     background:linear-gradient(180deg,var(--gold-l),var(--gold) 55%,var(--gold-d));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .rule{width:56px;height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .tag{color:var(--muted);font-size:15px;font-weight:300}

  a.app{
    position:relative;display:block;margin:44px 0 0;padding:30px 24px 26px;border-radius:26px;
    text-decoration:none;color:var(--cream);
    background:linear-gradient(160deg,#123a33,#0c2723);
    border:1px solid rgba(217,180,92,.35);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(240,216,152,.12);
    transition:transform .25s, box-shadow .25s, border-color .25s;
  }
  a.app:hover,a.app:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none;
     box-shadow:0 26px 60px -20px rgba(0,0,0,.8), 0 0 0 4px rgba(217,180,92,.08)}
  .badge{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;
     background:linear-gradient(160deg,var(--gold-l),var(--gold) 60%,var(--gold-d));
     color:#0b211e;font-family:"Reem Kufi",serif;font-size:34px;font-weight:700;
     box-shadow:0 8px 24px -8px rgba(217,180,92,.6)}
  .app b{display:block;font-family:"Reem Kufi",serif;font-weight:700;font-size:32px;color:var(--gold)}
  .app p{color:var(--muted);font-size:14px;margin-top:6px}
  .cta{display:inline-block;margin-top:20px;padding:10px 26px;border-radius:999px;font-weight:600;font-size:15px;
     color:#0b211e;background:linear-gradient(180deg,var(--gold-l),var(--gold))}

  nav{display:flex;justify-content:center;gap:16px;margin-top:40px}
  nav a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--gold);
     border:1px solid rgba(217,180,92,.3);transition:background .2s,border-color .2s,transform .2s}
  nav a:hover,nav a:focus-visible{background:rgba(217,180,92,.1);border-color:var(--gold);transform:translateY(-2px);outline:none}
  nav svg{width:22px;height:22px}
  footer{margin-top:40px;color:#4f6a63;font-size:12px;letter-spacing:.3px}
  @media (prefers-reduced-motion:reduce){main,.star{animation:none}}
</style>
</head>
<body>
<main>
  <svg class="star" viewBox="0 0 100 100" fill="none" stroke="#d9b45c" stroke-width="2.5" aria-hidden="true">
    <rect x="24" y="24" width="52" height="52"/>
    <rect x="24" y="24" width="52" height="52" transform="rotate(45 50 50)"/>
  </svg>
  <h1>حيدر نصيف</h1>
  <div class="rule"></div>
  <p class="tag">أبني أنظمة عربية تحلّ مشكلات حقيقية</p>

  <a class="app" href="https://prog-alone.github.io/khizana/">
    <div class="badge">خ</div>
    <b>خِزانة</b>
    <p>تطبيقي لإدارة أموالك الشخصية والعائلية</p>
    <span class="cta">ادخل التطبيق</span>
  </a>

  <nav>
    <a href="https://www.instagram.com/h.nj2/" aria-label="إنستغرام">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
    </a>
    <a href="https://www.linkedin.com/in/hnj2/" aria-label="لينكدإن">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.65 4.77 6.1V21h-4v-5.2c0-1.24-.02-2.84-1.73-2.84-1.73 0-2 1.35-2 2.75V21h-4z"/></svg>
    </a>
    <a href="mailto:haidernassef4@gmail.com" aria-label="البريد">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </a>
  </nav>

  <footer>© حيدر نصيف</footer>
</main>
</body>
</html>
