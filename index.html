<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haider Nassef</title>

<meta property="og:title" content="Haider Nassef">

<meta name="theme-color" content="#07080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#07080b; --card:#0f1117; --line:#1d212b; --text:#eef1f6; --soft:#8a93a6; --accent:#7aa2ff; --accent2:#b38cff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif; color:var(--text); background-color:var(--bg);
    background-image:
      radial-gradient(55% 35% at 50% 0%, rgba(122,162,255,.18), transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:auto, 32px 32px, 32px 32px;
    display:flex; justify-content:center; padding:64px 16px 40px;
  }
  main{width:100%;max-width:420px;text-align:center;animation:in .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .avatar{width:92px;height:92px;margin:0 auto 22px;border-radius:50%;padding:2px;
          background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent))}
  .avatar div{width:100%;height:100%;border-radius:50%;background:var(--bg);display:grid;place-items:center;
              font-weight:800;font-size:30px;letter-spacing:1px}
  h1{font-weight:800;font-size:34px;letter-spacing:-.5px}
  .ar{font-family:"IBM Plex Sans Arabic",sans-serif;color:var(--soft);font-size:15px;margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
  .chip{font-size:12.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(15,17,23,.8);color:#cfd5e2}
  .chip b{color:var(--accent);font-weight:600}
  .line{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--soft);margin-top:18px}
  .line span{color:var(--accent)}

  .label{font-size:11px;letter-spacing:3px;color:var(--soft);text-transform:uppercase;margin:44px 0 14px;text-align:left}
  a.work{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;text-decoration:none;color:var(--text);
         background:var(--card);border:1px solid var(--line);transition:border-color .2s,transform .2s,box-shadow .2s}
  a.work:hover,a.work:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none;
         box-shadow:0 0 0 4px rgba(122,162,255,.08),0 20px 40px -24px rgba(122,162,255,.5)}
  .icon{flex:0 0 50px;height:50px;border-radius:13px;display:grid;place-items:center;background:#0b211e;color:#d9b45c;
        font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:600;font-size:24px}
  .txt{flex:1;text-align:left}
  .txt b{display:block;font-size:16px;font-weight:600}
  .txt b i{font-style:normal;font-family:"IBM Plex Sans Arabic",sans-serif;color:var(--soft);font-weight:400;margin-left:6px}
  .txt span{display:block;font-size:13px;color:var(--soft);margin-top:2px}
  .arrow{color:var(--soft);font-size:18px;transition:transform .2s,color .2s}
  a.work:hover .arrow{transform:translateX(3px);color:var(--accent)}

  nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
  nav a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;text-decoration:none;
        color:var(--text);font-size:12px;background:var(--card);border:1px solid var(--line);transition:border-color .2s,color .2s}
  nav a:hover,nav a:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
  nav svg{width:20px;height:20px}
  footer{margin-top:44px;color:#4b5263;font-size:12px}
  @media (prefers-reduced-motion:reduce){main{animation:none}}
</style>
</head>
<body>
<main>
  <div class="avatar"><div>HN</div></div>
  <h1>Haider Nassef</h1>
  <p class="ar">حيدر نصيف</p>

  <div class="chips">
    <span class="chip"><b>Full-Stack</b> Developer</span>
    <span class="chip"><b>M.Sc.</b> Artificial Intelligence</span>
    <span class="chip"><b>System</b> Administrator</span>
  </div>
  <p class="line"><span>&gt;</span> Turning real problems into simple Arabic software.</p>

  <div class="label">Work</div>
  <a class="work" href="https://prog-alone.github.io/khizana/">
    <div class="icon">خ</div>
    <div class="txt"><b>Khizana <i>خِزانة</i></b><span>Personal &amp; family money manager</span></div>
    <div class="arrow">→</div>
  </a>

  <nav>
    <a href="https://www.linkedin.com/in/hnj2/">

    <a href="https://www.instagram.com/h.nj2/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Instagram</a>
    <a href="mailto:haidernassef4@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</a>
  </nav>

  <footer>© Haider Nassef</footer>
</main>
</body>
</html>
